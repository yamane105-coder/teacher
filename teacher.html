<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>こころのハート｜先生用URL作成</title><style>body{margin:0;background:#f6f8ff;color:#23314b;font:16px/1.5 system-ui,'Yu Gothic',sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}h1{font-size:1.55rem}.card{background:white;border:1px solid #e0e7f2;border-radius:16px;padding:18px;margin:14px 0}label{display:block;font-weight:bold;margin-top:12px}input{display:block;width:100%;padding:10px;margin-top:5px;box-sizing:border-box;border:1px solid #aebcd2;border-radius:8px;font:inherit}button{background:#213c69;color:white;padding:11px 16px;border:0;border-radius:10px;font:inherit;font-weight:bold;cursor:pointer;margin:5px 5px 5px 0}.muted{color:#5b667a;font-size:.9rem}.scene{border:1px solid #d6e0ee;padding:14px;border-radius:13px;margin-top:12px}.scene h3{margin:0}#result{overflow-wrap:anywhere;background:#e9f1ff;border-radius:10px;padding:14px}a{color:#174a95}button.secondary{background:#62748e}button.danger{background:#974359}.row{display:flex;flex-wrap:wrap;gap:6px}.hide{display:none}</style></head><body><main class="wrap"><h1>♡ こころのハート：先生用</h1><p>題材と場面を入力し、児童に配るURLを作成します。学校のGoogleアカウントとの連携はありません。</p><section class="card"><label>題材名<input id="title" maxlength="100" value="くまくんの きもち"></label><label>児童用アプリの公開URL（最初の1回だけ入力）<input id="base" type="url" placeholder="https://example.org/kokoro/index.html"></label><p class="muted">※ GoogleサイトのURLではなく、実際に公開した <b>index.html</b> のURLを入力してください。</p><div id="scenes"></div><button class="secondary" id="add">＋ ばめんを ふやす</button></section><section class="card"><button id="make">児童用URLをつくる</button><div id="output" class="hide"><p><strong>Classroomに貼るURL</strong></p><p id="result"></p><div class="row"><button id="copy">URLをコピー</button><button id="open" class="secondary">児童画面で確認</button></div><p class="muted">このURLには題材と場面の設定が含まれます。後から設定を変えたら、URLを作り直してください。</p></div><p id="error" style="color:#b1264b"></p></section><section class="card"><strong>公開前に確認</strong><p class="muted">先生用ファイルは自分のパソコンに保管し、児童には <b>index.html</b> のURLだけを配布します。URL自体は秘密情報ではなく、知っている人は設定を読み取れます。児童の氏名や個人情報を入力しないでください。</p></section></main><script>
const $=id=>document.getElementById(id);let list=[{name:'ともだちを まっている とき',neg:'かなしい',pos:'うれしい'},{name:'こえを かけられた とき',neg:'しんぱい',pos:'あんしん'},{name:'いっしょに あそんでいる とき',neg:'さみしい',pos:'たのしい'}];let result='';
function render(){const root=$('scenes');root.replaceChildren();list.forEach((s,i)=>{const d=document.createElement('div');d.className='scene';const h=document.createElement('h3');h.textContent='ばめん '+(i+1);d.append(h);[['name','場面の名前'],['neg','水色の気持ち'],['pos','ピンクの気持ち']].forEach(([k,l])=>{const label=document.createElement('label');label.textContent=l;const inp=document.createElement('input');inp.value=s[k];inp.maxLength=130;inp.addEventListener('input',e=>{s[k]=e.target.value});label.append(inp);d.append(label)});const rm=document.createElement('button');rm.textContent='この場面を削除';rm.className='danger';rm.disabled=list.length===1;rm.onclick=()=>{list.splice(i,1);render()};d.append(rm);root.append(d)})}
function encode(o){const bytes=new TextEncoder().encode(JSON.stringify(o));let binary='';for(let j=0;j<bytes.length;j++)binary+=String.fromCharCode(bytes[j]);return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
$('add').onclick=()=>{if(list.length>=15){alert('場面は15こまでです');return}list.push({name:'あたらしい ばめん',neg:'かなしい',pos:'うれしい'});render()};$('make').onclick=()=>{try{if(!list.every(s=>s.name.trim()&&s.neg.trim()&&s.pos.trim()))throw Error('空欄をなくしてください');const title=$('title').value.trim();if(!title)throw Error('題材名を入力してください');const u=new URL($('base').value.trim());if(!/^https?:$/.test(u.protocol))throw Error('http または https のURLを入力してください');u.searchParams.set('c',encode({title,scenes:list.map(s=>({name:s.name.trim(),neg:s.neg.trim(),pos:s.pos.trim()}))}));result=u.toString();$('result').textContent=result;$('output').classList.remove('hide');$('error').textContent='';}catch(e){$('error').textContent=e.message;$('output').classList.add('hide')}};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(result);alert('コピーしました')}catch(e){prompt('こちらをコピーしてください',result)}};$('open').onclick=()=>window.open(result,'_blank','noopener,noreferrer');render();
</script></body></html>
