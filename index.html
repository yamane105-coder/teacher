<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>こころのハート</title><style>
:root{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;color:#263449;background:#f7f9ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:740px;margin:auto;padding:16px}header{text-align:center}h1{font-size:1.65rem;margin:12px 0 5px}h2{font-size:1.2rem;margin:7px 0}.card{background:white;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #23345412}.scene{color:#374960;text-align:center;font-weight:bold;font-size:1.25rem;white-space:pre-wrap}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.tabs button{flex:1;min-width:85px}.btn,button{font:inherit;cursor:pointer;border:2px solid #b9c8dd;background:white;color:#273a51;border-radius:13px;padding:11px 13px;font-weight:bold}.active{background:#243e69!important;border-color:#243e69!important;color:white!important}.heart{display:block;width:min(100%,370px);height:260px;margin:auto}.legend{display:flex;justify-content:space-between;gap:10px;font-weight:bold}.blue{color:#1378a7}.pink{color:#bc477f}.feels{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}.feel{display:flex;align-items:center;text-align:left;gap:12px}.bar{display:flex;overflow:hidden;width:72px;height:17px;border-radius:5px;flex-shrink:0}.bar span{height:100%}.sizes{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.small{font-size:.87rem;color:#617087}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.tile{padding:8px;border:1px solid #cdd7e6;border-radius:14px;text-align:center}.tile svg{width:100%;height:130px}.notice{border-radius:12px;background:#eef3ff;padding:12px;font-size:.9rem}.hidden{display:none}.error{color:#a32f4c}button:focus-visible{outline:3px solid #ffae00;outline-offset:3px}@media(min-width:600px){.feels{grid-template-columns:1fr 1fr}.feel:last-child{grid-column:span 2}}
</style></head><body><main class="wrap"><header><h1>♡ こころのハート</h1><div id="subject"></div></header><section id="app"><div class="card"><div id="scene" class="scene"></div><div class="tabs" id="tabs"></div></div><div id="single" class="card"><svg id="heart" class="heart" viewBox="0 0 320 265" role="img" aria-label="気持ちを表したハート"><defs><clipPath id="clip"><path d="M160 244 C115 209 19 144 19 80 C19 22 99 8 140 61 L160 85 L180 61 C221 8 301 22 301 80 C301 144 205 209 160 244Z"/></clipPath></defs><g id="scaled"><g clip-path="url(#clip)"><rect width="320" height="265" fill="#8bd7f4"/><rect id="pink" y="0" height="265" fill="#f6a6c9" /></g><path d="M160 244 C115 209 19 144 19 80 C19 22 99 8 140 61 L160 85 L180 61 C221 8 301 22 301 80 C301 144 205 209 160 244Z" fill="none" stroke="#6c7e94" stroke-width="3"/></g></svg><div class="legend"><span class="blue" id="neg"></span><span class="pink" id="pos"></span></div><h2>① きもちを えらぼう</h2><div id="feels" class="feels"></div><h2>② ハートの おおきさ</h2><div class="sizes" id="sizes"></div><div class="legend small"><span>ちいさい</span><span>おおきい</span></div></div><section id="all" class="card hidden"><h2>ぜんぶの ばめん</h2><div id="comparison" class="compare"></div></section><div class="actions"><button id="prev">← まえの ばめん</button><button id="allbtn">♡ ぜんぶ みる</button><button id="next">つぎの ばめん →</button></div><p class="small">※ せんせいへの ていしゅつは ありません。ページを とじると、ハートは はじめからに なります。</p></section><div id="err" class="notice error hidden"></div></main><script>
'use strict';
const defaults={title:'くまくんの きもち',scenes:[{name:'ともだちを まっている とき',neg:'かなしい',pos:'うれしい'},{name:'こえを かけられた とき',neg:'しんぱい',pos:'あんしん'},{name:'いっしょに あそんでいる とき',neg:'さみしい',pos:'たのしい'}]};
function decode(s){const raw=atob(s.replace(/-/g,'+').replace(/_/g,'/'));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
function valid(o){return o&&typeof o.title==='string'&&o.title.length<=100&&Array.isArray(o.scenes)&&o.scenes.length>=1&&o.scenes.length<=15&&o.scenes.every(s=>s&&['name','neg','pos'].every(k=>typeof s[k]==='string'&&s[k].length>0&&s[k].length<=130))}
let config=defaults;try{const s=new URLSearchParams(location.search).get('c');if(s){const p=decode(s);if(!valid(p))throw Error('設定内容が正しくありません');config=p}}catch(e){document.getElementById('err').textContent='URLの設定を読み込めませんでした。先生に確認してください。';document.getElementById('err').classList.remove('hidden');document.getElementById('app').classList.add('hidden')}
const $=id=>document.getElementById(id);let i=0,showAll=false;const ans=config.scenes.map(()=>({feel:2,size:3}));$('subject').textContent=config.title;
function heartSVG(feel,size){const frac=feel/4,scale=[0,.45,.59,.73,.87,1][size];return `<svg viewBox="0 0 320 265" role="img" aria-label="ハート"><defs><clipPath id="tinyclip"><path d="M160 244 C115 209 19 144 19 80 C19 22 99 8 140 61 L160 85 L180 61 C221 8 301 22 301 80 C301 144 205 209 160 244Z"/></clipPath></defs><g transform="translate(160 132) scale(${scale}) translate(-160 -132)"><g clip-path="url(#tinyclip)"><rect width="320" height="265" fill="#8bd7f4"/><rect x="${320*(1-frac)}" width="${320*frac}" height="265" fill="#f6a6c9"/></g><path d="M160 244 C115 209 19 144 19 80 C19 22 99 8 140 61 L160 85 L180 61 C221 8 301 22 301 80 C301 144 205 209 160 244Z" fill="none" stroke="#6c7e94" stroke-width="3"/></g></svg>`}
function txt(el,t){el.textContent=t}
function render(){const s=config.scenes[i],a=ans[i];txt($('scene'),`ばめん ${i+1}：${s.name}`);txt($('neg'),'みずいろ：'+s.neg);txt($('pos'),'ピンク：'+s.pos);$('tabs').replaceChildren();config.scenes.forEach((sc,n)=>{const b=document.createElement('button');b.textContent=`ばめん ${n+1}`;if(n===i&&!showAll)b.className='active';b.onclick=()=>{i=n;showAll=false;render()};$('tabs').append(b)});const frac=a.feel/4;$('pink').setAttribute('x',320*(1-frac));$('pink').setAttribute('width',320*frac);const scale=[0,.45,.59,.73,.87,1][a.size];$('scaled').setAttribute('transform',`translate(160 132) scale(${scale}) translate(-160 -132)`);const opts=[s.neg,'どちらかといえば '+s.neg,'はんぶんずつ','どちらかといえば '+s.pos,s.pos];$('feels').replaceChildren();opts.forEach((v,n)=>{const b=document.createElement('button');b.className='feel'+(n===a.feel?' active':'');const bar=document.createElement('span');bar.className='bar';const blue=document.createElement('span');blue.style.width=(100-n*25)+'%';blue.style.background='#8bd7f4';const pink=document.createElement('span');pink.style.flex='1';pink.style.background='#f6a6c9';bar.append(blue,pink);const t=document.createElement('span');t.textContent=v;b.append(bar,t);b.onclick=()=>{a.feel=n;render()};$('feels').append(b)});$('sizes').replaceChildren();for(let n=1;n<=5;n++){const b=document.createElement('button');b.textContent=n;if(n===a.size)b.className='active';b.onclick=()=>{a.size=n;render()};$('sizes').append(b)}$('single').classList.toggle('hidden',showAll);$('all').classList.toggle('hidden',!showAll);$('allbtn').textContent=showAll?'♡ もどる':'♡ ぜんぶ みる';$('prev').disabled=i===0;$('next').disabled=i===config.scenes.length-1;if(showAll){$('comparison').replaceChildren();config.scenes.forEach((sc,n)=>{const d=document.createElement('div');d.className='tile';const h=document.createElement('strong');h.textContent=`ばめん ${n+1}：${sc.name}`;const image=document.createElement('div');image.innerHTML=heartSVG(ans[n].feel,ans[n].size);const sub=document.createElement('div');sub.className='small';sub.textContent=`${[sc.neg,'どちらかといえば '+sc.neg,'はんぶんずつ','どちらかといえば '+sc.pos,sc.pos][ans[n].feel]} ・ おおきさ${ans[n].size}`;d.append(h,image,sub);$('comparison').append(d)})}}
$('prev').onclick=()=>{if(i>0){i--;showAll=false;render()}};$('next').onclick=()=>{if(i<config.scenes.length-1){i++;showAll=false;render()}};$('allbtn').onclick=()=>{showAll=!showAll;render()};render();
</script></body></html>
